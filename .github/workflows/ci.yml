name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck scripts/*.sh

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-unknown-freebsd

      - name: Test
        run: cargo test --locked

      - name: Build linux/amd64 static
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Build linux/arm64 static
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo build --release --locked --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/dcheck

      - name: Check FreeBSD build
        run: cargo check --locked --target x86_64-unknown-freebsd

      - name: Verify static ELF
        run: |
          file target/x86_64-unknown-linux-musl/release/dcheck
          test -x target/x86_64-unknown-linux-musl/release/dcheck

      - name: Fixture test (static binary)
        env:
          DCHECK_BIN: target/x86_64-unknown-linux-musl/release/dcheck
        run: ./scripts/test-dcheck.sh

      - name: JSON output smoke test
        env:
          DCHECK_DEMO: "1"
        run: |
          target/x86_64-unknown-linux-musl/release/dcheck storage --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and d; print("json ok:", len(d), "devices")'
