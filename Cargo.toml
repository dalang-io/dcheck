[package]
name = "dcheck"
version = "0.5.1"
edition = "2024"
rust-version = "1.98.1"
description = "Device health check — storage identity, capacity, SMART health and life estimate"
license = "MIT"
repository = "https://github.com/dalang-io/dcheck"
readme = "README.md"

[lib]
name = "dcheck"
path = "src/lib.rs"

[[bin]]
name = "dcheck"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
ratatui = "0.29.0"
wayang-tui = { git = "https://github.com/dalang-io/wayang-tui", tag = "v0.2.1" }
